<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>客服系统 - 用户端测试</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
            background-color: #f5f5f5;
        }

        .main-layout {
            display: flex;
            height: 100vh;
        }

        /* 左侧聊天区域 */
        .chat-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: white;
            border-right: 1px solid #ddd;
        }

        .chat-header {
            padding: 15px 20px;
            border-bottom: 1px solid #ddd;
            background: #f8f9fa;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }

        .status-badge {
            padding: 5px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-badge.connected {
            background-color: #d4edda;
            color: #155724;
        }

        .status-badge.disconnected {
            background-color: #f8d7da;
            color: #721c24;
        }

        .heartbeat-status {
            font-size: 11px;
            color: #666;
            margin-top: 5px;
        }

        .heartbeat-status.active {
            color: #28a745;
        }

        .heartbeat-status.inactive {
            color: #999;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f9f9f9;
        }

        .message-item {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }

        .message-item.self {
            align-items: flex-end;
        }

        .message-item.other {
            align-items: flex-start;
        }

        .message-bubble {
            max-width: 70%;
            padding: 10px 15px;
            border-radius: 12px;
            word-wrap: break-word;
            position: relative;
        }

        .message-item.self .message-bubble {
            background: #007bff;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message-item.other .message-bubble {
            background: white;
            color: #333;
            border: 1px solid #e0e0e0;
            border-bottom-left-radius: 4px;
        }

        .message-item.system .message-bubble {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffc107;
            max-width: 100%;
            text-align: center;
        }

        .message-item.error .message-bubble {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #dc3545;
            max-width: 100%;
        }

        .message-time {
            font-size: 11px;
            color: #999;
            margin-top: 5px;
            padding: 0 5px;
        }

        .message-sender {
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
            padding: 0 5px;
        }

        .chat-input-area {
            padding: 15px 20px;
            border-top: 1px solid #ddd;
            background: white;
        }

        .input-group {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .input-wrapper {
            flex: 1;
        }

        .input-wrapper textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            resize: none;
            font-family: inherit;
            min-height: 60px;
            max-height: 120px;
        }

        .input-wrapper textarea:focus {
            outline: none;
            border-color: #007bff;
        }

        .send-button {
            padding: 10px 24px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
        }

        .send-button:hover:not(:disabled) {
            background: #0056b3;
        }

        .send-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* 右侧配置面板 */
        .config-panel {
            width: 400px;
            background: white;
            overflow-y: auto;
            border-left: 1px solid #ddd;
        }

        .config-section {
            padding: 20px;
            border-bottom: 1px solid #eee;
        }

        .config-section h3 {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #007bff;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
            font-weight: 500;
            color: #555;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #007bff;
        }

        .btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        button {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-primary {
            background-color: #007bff;
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background-color: #0056b3;
        }

        .btn-success {
            background-color: #28a745;
            color: white;
        }

        .btn-success:hover:not(:disabled) {
            background-color: #218838;
        }

        .btn-danger {
            background-color: #dc3545;
            color: white;
        }

        .btn-danger:hover:not(:disabled) {
            background-color: #c82333;
        }

        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }

        .btn-secondary:hover:not(:disabled) {
            background-color: #5a6268;
        }

        .mode-tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
        }

        .mode-tab {
            flex: 1;
            padding: 8px;
            border: 1px solid #ddd;
            background: white;
            color: #666;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            text-align: center;
        }

        .mode-tab.active {
            background: #007bff;
            color: white;
            border-color: #007bff;
        }

        .mode-content {
            display: none;
        }

        .mode-content.active {
            display: block;
        }

        .connection-controls {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        .connection-controls button {
            flex: 1;
        }

        @media (max-width: 768px) {
            .main-layout {
                flex-direction: column;
            }

            .config-panel {
                width: 100%;
                max-height: 50vh;
            }

            .chat-panel {
                height: 50vh;
            }
        }
    </style>
</head>
<body>
    <div class="main-layout">
        <!-- 左侧聊天区域 -->
        <div class="chat-panel">
            <div class="chat-header">
                <div class="chat-title">客服对话</div>
                <div id="statusBadge" class="status-badge disconnected">未连接</div>
            </div>
            <div id="chatMessages" class="chat-messages">
                <div class="message-item system">
                    <div class="message-bubble">欢迎使用客服系统测试工具</div>
                </div>
            </div>
            <div class="chat-input-area">
                <div class="input-group">
                    <div class="input-wrapper">
                        <textarea id="messageInput" placeholder="输入消息..." rows="2"></textarea>
                    </div>
                    <button class="send-button" id="sendBtn" onclick="sendChatMessage()" disabled>发送</button>
                </div>
            </div>
        </div>

        <!-- 右侧配置面板 -->
        <div class="config-panel">
            <!-- 连接配置 -->
            <div class="config-section">
                <h3>连接配置</h3>
                <div class="form-group">
                    <label>WebSocket 地址:</label>
                    <input type="text" id="wsUrl" value="ws://127.0.0.1:9502/ws">
                </div>
                <div class="connection-controls">
                    <button class="btn-primary" id="connectBtn" onclick="connect()">连接</button>
                    <button class="btn-danger" id="disconnectBtn" onclick="disconnect()" disabled>断开</button>
                </div>
                <div class="form-group" style="margin-top: 15px;">
                    <label>
                        <input type="checkbox" id="heartbeatEnabled" checked> 启用心跳
                    </label>
                </div>
                <div class="form-group">
                    <label>心跳间隔 (秒):</label>
                    <input type="number" id="heartbeatInterval" value="30" min="5" max="300">
                </div>
                <div class="heartbeat-status inactive" id="heartbeatStatus">心跳: 未启动</div>
            </div>

            <!-- 模式切换 -->
            <div class="config-section">
                <h3>测试模式</h3>
                <div class="mode-tabs">
                    <div class="mode-tab active" onclick="switchMode('user')">普通用户</div>
                    <div class="mode-tab" onclick="switchMode('visitor')">游客模式</div>
                </div>
            </div>

            <!-- 普通用户模式 -->
            <div id="userMode" class="mode-content active">
                <div class="config-section">
                    <h3>用户认证</h3>
                    <div class="form-group">
                        <label>JWT Token:</label>
                        <input type="text" id="userToken" placeholder="请输入用户 Token">
                    </div>
                    <div class="btn-group">
                        <button class="btn-success" id="userAuthBtn" onclick="userLogin()" disabled>登录认证</button>
                    </div>
                </div>

                <div class="config-section">
                    <h3>会话管理</h3>
                    <div class="form-group">
                        <label>API 基础地址:</label>
                        <input type="text" id="apiBaseUrl" value="http://127.0.0.1:9501">
                    </div>
                    <div class="btn-group">
                        <button class="btn-primary" id="getConversationBtn" onclick="getConversation()" disabled>获取会话</button>
                    </div>
                    <div class="form-group">
                        <label>会话ID:</label>
                        <input type="number" id="conversationId" placeholder="会话ID" readonly>
                    </div>
                </div>

                <div class="config-section">
                    <h3>消息类型</h3>
                    <div class="form-group">
                        <label>消息类型:</label>
                        <select id="userMessageType">
                            <option value="1">文本消息</option>
                            <option value="2">图片消息</option>
                            <option value="3">文件消息</option>
                        </select>
                    </div>
                    <div class="form-group" id="fileUrlGroup" style="display: none;">
                        <label>文件URL:</label>
                        <input type="text" id="userFileUrl" placeholder="https://example.com/image.jpg">
                    </div>
                </div>

                <div class="config-section">
                    <h3>操作</h3>
                    <div class="btn-group">
                        <button class="btn-primary" id="markReadBtn" onclick="markRead()" disabled>标记已读</button>
                        <button class="btn-danger" id="endConversationBtn" onclick="endConversation()" disabled>结束会话</button>
                    </div>
                    <div class="form-group" style="margin-top: 15px;">
                        <label>消息ID列表 (用逗号分隔):</label>
                        <input type="text" id="messageIds" placeholder="1,2,3">
                    </div>
                </div>
            </div>

            <!-- 游客模式 -->
            <div id="visitorMode" class="mode-content">
                <div class="config-section">
                    <h3>游客信息</h3>
                    <div class="form-group">
                        <label>游客ID (visitor_id):</label>
                        <input type="text" id="visitorId" placeholder="visitor_123456" value="visitor_123456">
                    </div>
                    <div class="btn-group">
                        <button class="btn-success" id="visitorBindBtn" onclick="visitorBind()" disabled>绑定连接</button>
                    </div>
                </div>

                <div class="config-section">
                    <h3>客服信息</h3>
                    <div class="form-group">
                        <label>客服ID (kefu_id):</label>
                        <input type="text" id="kefuId" placeholder="1" value="1">
                    </div>
                </div>

                <div class="config-section">
                    <h3>操作</h3>
                    <div class="btn-group">
                        <button class="btn-danger" id="visitorEndBtn" onclick="visitorEndConversation()" disabled>结束会话</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let ws = null;
        let isAuthenticated = false;
        let currentMode = 'user';
        let conversationId = null;
        let heartbeatTimer = null;
        let lastHeartbeatTime = null;

        function switchMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.mode-content').forEach(content => content.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(mode + 'Mode').classList.add('active');
        }

        function addChatMessage(content, type = 'other', sender = '') {
            const messagesDiv = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message-item ${type}`;
            
            const time = new Date().toLocaleTimeString();
            let html = '';
            
            if (sender) {
                html += `<div class="message-sender">${escapeHtml(sender)}</div>`;
            }
            
            html += `<div class="message-bubble">${escapeHtml(content)}</div>`;
            html += `<div class="message-time">${time}</div>`;
            
            messageDiv.innerHTML = html;
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function updateStatus(status, className) {
            const statusBadge = document.getElementById('statusBadge');
            statusBadge.textContent = status;
            statusBadge.className = `status-badge ${className}`;
        }

        function connect() {
            const url = document.getElementById('wsUrl').value;
            if (!url) {
                alert('请输入 WebSocket 地址');
                return;
            }

            try {
                ws = new WebSocket(url);

                ws.onopen = () => {
                    updateStatus('已连接', 'connected');
                    addChatMessage('WebSocket 连接成功', 'system');
                    document.getElementById('connectBtn').disabled = true;
                    document.getElementById('disconnectBtn').disabled = false;
                    
                    if (currentMode === 'user') {
                        document.getElementById('userAuthBtn').disabled = false;
                    } else {
                        document.getElementById('visitorBindBtn').disabled = false;
                        document.getElementById('sendBtn').disabled = false;
                        document.getElementById('visitorEndBtn').disabled = false;
                    }

                    // 启动心跳
                    startHeartbeat();
                };

                ws.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);

                        // 处理心跳响应
                        if (data.action === 'ping' || data.action === 'heartbeat' || data.type === 'pong') {
                            updateHeartbeatStatus(true);
                            return;
                        }

                        // 处理推送消息
                        if (data.type === 'push_message') {
                            if (data.action === 'kefu_message') {
                                addChatMessage(data.content || '无内容', 'other', `客服 ${data.sender_id}`);
                            } else if (data.action === 'kefu_visitor_message') {
                                addChatMessage(data.content || '无内容', 'other', `客服 ${data.sender_id}`);
                            } else if (data.action === 'kefu_message_end' || data.action === 'kefu_visitor_conversation_end') {
                                addChatMessage('会话已结束', 'system');
                            }
                        }
                        // 处理普通响应
                        else {
                            if (data.success === true) {
                                if (data.message && data.message.includes('Auth successfully')) {
                                    isAuthenticated = true;
                                    addChatMessage('认证成功！', 'system');
                                    document.getElementById('getConversationBtn').disabled = false;
                                    document.getElementById('sendBtn').disabled = false;
                                    document.getElementById('markReadBtn').disabled = false;
                                    document.getElementById('endConversationBtn').disabled = false;
                                } else if (data.message && data.message.includes('Bind key successfully')) {
                                    addChatMessage('游客连接绑定成功！', 'system');
                                    document.getElementById('sendBtn').disabled = false;
                                } else if (data.message && data.message.includes('sent successfully')) {
                                    addChatMessage('消息发送成功', 'system');
                                } else {
                                    addChatMessage(data.message || '操作成功', 'system');
                                }
                            } else {
                                addChatMessage(`错误: ${data.message || '操作失败'}`, 'error');
                            }
                        }
                    } catch (e) {
                        addChatMessage(`收到非 JSON 消息: ${event.data}`, 'system');
                    }
                };

                ws.onerror = (error) => {
                    addChatMessage('WebSocket 连接错误', 'error');
                    updateStatus('连接错误', 'disconnected');
                };

                ws.onclose = () => {
                    updateStatus('已断开', 'disconnected');
                    addChatMessage('WebSocket 连接已关闭', 'system');
                    document.getElementById('connectBtn').disabled = false;
                    document.getElementById('disconnectBtn').disabled = true;
                    document.getElementById('userAuthBtn').disabled = true;
                    document.getElementById('getConversationBtn').disabled = true;
                    document.getElementById('sendBtn').disabled = true;
                    document.getElementById('markReadBtn').disabled = true;
                    document.getElementById('endConversationBtn').disabled = true;
                    document.getElementById('visitorBindBtn').disabled = true;
                    document.getElementById('visitorEndBtn').disabled = true;
                    isAuthenticated = false;
                    
                    // 停止心跳
                    stopHeartbeat();
                };
            } catch (error) {
                addChatMessage(`连接失败: ${error.message}`, 'error');
            }
        }

        function disconnect() {
            stopHeartbeat();
            if (ws) {
                ws.close();
                ws = null;
            }
        }

        function startHeartbeat() {
            stopHeartbeat();
            
            const enabled = document.getElementById('heartbeatEnabled').checked;
            if (!enabled) {
                updateHeartbeatStatus(false);
                return;
            }

            const interval = parseInt(document.getElementById('heartbeatInterval').value) * 1000;
            if (interval < 5000) {
                alert('心跳间隔不能小于5秒');
                return;
            }

            updateHeartbeatStatus(true);
            
            // 立即发送一次心跳
            sendHeartbeat();
            
            // 设置定时器
            heartbeatTimer = setInterval(() => {
                sendHeartbeat();
            }, interval);
        }

        function stopHeartbeat() {
            if (heartbeatTimer) {
                clearInterval(heartbeatTimer);
                heartbeatTimer = null;
            }
            updateHeartbeatStatus(false);
        }

        function sendHeartbeat() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                return;
            }

            try {
                lastHeartbeatTime = new Date();
                const heartbeatMsg = {
                    action: 'ping',
                    op_id: 'heartbeat_' + Date.now()
                };
                ws.send(JSON.stringify(heartbeatMsg));
                updateHeartbeatStatus(true);
            } catch (error) {
                console.error('发送心跳失败:', error);
            }
        }

        function updateHeartbeatStatus(active) {
            const statusEl = document.getElementById('heartbeatStatus');
            if (active && lastHeartbeatTime) {
                const timeStr = lastHeartbeatTime.toLocaleTimeString();
                statusEl.textContent = `心跳: 已发送 (${timeStr})`;
                statusEl.className = 'heartbeat-status active';
            } else {
                statusEl.textContent = '心跳: 未启动';
                statusEl.className = 'heartbeat-status inactive';
            }
        }

        function sendMessage(data) {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                alert('WebSocket 未连接');
                return;
            }

            try {
                const json = JSON.stringify(data);
                ws.send(json);
            } catch (error) {
                addChatMessage(`发送失败: ${error.message}`, 'error');
            }
        }

        function sendChatMessage() {
            const input = document.getElementById('messageInput');
            const content = input.value.trim();
            
            if (!content) {
                return;
            }

            if (currentMode === 'user') {
                userSendMessage(content);
            } else {
                visitorSendMessage(content);
            }

            input.value = '';
        }

        // 普通用户模式功能
        function userLogin() {
            const token = document.getElementById('userToken').value;
            if (!token) {
                alert('请输入 Token');
                return;
            }

            sendMessage({
                action: 'login',
                data: {
                    token: token
                },
                op_id: 'login_' + Date.now()
            });
        }

        async function getConversation() {
            const apiBaseUrl = document.getElementById('apiBaseUrl').value;
            const token = document.getElementById('userToken').value;

            if (!apiBaseUrl || !token) {
                alert('请填写 API 地址和 Token');
                return;
            }

            try {
                const response = await fetch(`${apiBaseUrl}/api/kefu/message/getConversation`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                const result = await response.json();
                
                if (result.code === 200 && result.data) {
                    conversationId = result.data.id;
                    document.getElementById('conversationId').value = result.data.id;
                    addChatMessage(`获取会话成功: 会话ID=${result.data.id}, 客服ID=${result.data.kefu_id}`, 'system');
                } else {
                    addChatMessage(`获取会话失败: ${result.message || '未知错误'}`, 'error');
                }
            } catch (error) {
                addChatMessage(`获取会话失败: ${error.message}`, 'error');
            }
        }

        function userSendMessage(content) {
            if (!conversationId) {
                const convId = document.getElementById('conversationId').value;
                if (!convId) {
                    alert('请先获取会话ID');
                    return;
                }
                conversationId = parseInt(convId);
            }

            const messageType = parseInt(document.getElementById('userMessageType').value);
            const fileUrl = document.getElementById('userFileUrl').value;

            if ((messageType === 2 || messageType === 3) && !fileUrl) {
                alert('请输入文件URL');
                return;
            }

            // 显示发送的消息
            addChatMessage(content, 'self', '我');

            const data = {
                action: 'kefu_message_send',
                data: {
                    conversation_id: conversationId,
                    message_type: messageType,
                    content: content
                },
                op_id: 'send_' + Date.now()
            };

            if (fileUrl) {
                data.data.file_url = fileUrl;
            }

            sendMessage(data);
        }

        function markRead() {
            if (!conversationId) {
                alert('请先获取会话ID');
                return;
            }

            const messageIdsStr = document.getElementById('messageIds').value;
            if (!messageIdsStr) {
                alert('请输入消息ID列表');
                return;
            }

            const messageIds = messageIdsStr.split(',').map(id => parseInt(id.trim())).filter(id => !isNaN(id));

            if (messageIds.length === 0) {
                alert('请输入有效的消息ID');
                return;
            }

            sendMessage({
                action: 'kefu_message_read',
                data: {
                    conversation_id: conversationId,
                    message_ids: messageIds,
                    sender_type: 2
                },
                op_id: 'read_' + Date.now()
            });
        }

        function endConversation() {
            if (!conversationId) {
                alert('请先获取会话ID');
                return;
            }

            if (!confirm('确定要结束会话吗？')) {
                return;
            }

            sendMessage({
                action: 'kefu_message_end',
                data: {
                    conversation_id: conversationId
                },
                op_id: 'end_' + Date.now()
            });
        }

        // 游客模式功能
        function visitorBind() {
            const visitorId = document.getElementById('visitorId').value;

            if (!visitorId) {
                alert('请输入游客ID');
                return;
            }

            sendMessage({
                action: 'kefu_message_visitor_bind_fd',
                data: {
                    bind_key: visitorId
                },
                op_id: 'bind_' + Date.now()
            });
        }

        function visitorSendMessage(content) {
            const visitorId = document.getElementById('visitorId').value;
            const kefuId = document.getElementById('kefuId').value;

            if (!visitorId) {
                alert('请输入游客ID');
                return;
            }

            if (!kefuId) {
                alert('请输入客服ID');
                return;
            }

            // 显示发送的消息
            addChatMessage(content, 'self', '我');

            sendMessage({
                action: 'kefu_message_visitor_send',
                data: {
                    visitor_id: visitorId,
                    kefu_id: kefuId,
                    content: content
                },
                op_id: 'visitor_send_' + Date.now()
            });
        }

        function visitorEndConversation() {
            const visitorId = document.getElementById('visitorId').value;
            const kefuId = document.getElementById('kefuId').value;

            if (!visitorId || !kefuId) {
                alert('请填写游客ID和客服ID');
                return;
            }

            if (!confirm('确定要结束会话吗？')) {
                return;
            }

            sendMessage({
                action: 'kefu_message_visitor_end',
                data: {
                    visitor_id: visitorId,
                    kefu_id: kefuId
                },
                op_id: 'visitor_end_' + Date.now()
            });
        }

        // 消息类型切换时显示/隐藏文件URL输入
        document.getElementById('userMessageType').addEventListener('change', function() {
            const fileUrlGroup = document.getElementById('fileUrlGroup');
            if (this.value === '2' || this.value === '3') {
                fileUrlGroup.style.display = 'block';
            } else {
                fileUrlGroup.style.display = 'none';
            }
        });

        // 回车发送消息
        document.getElementById('messageInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendChatMessage();
            }
        });

        // 心跳设置变化时重新启动
        document.getElementById('heartbeatEnabled').addEventListener('change', function() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                if (this.checked) {
                    startHeartbeat();
                } else {
                    stopHeartbeat();
                }
            }
        });

        document.getElementById('heartbeatInterval').addEventListener('change', function() {
            if (ws && ws.readyState === WebSocket.OPEN && document.getElementById('heartbeatEnabled').checked) {
                startHeartbeat();
            }
        });
    </script>
</body>
</html>
