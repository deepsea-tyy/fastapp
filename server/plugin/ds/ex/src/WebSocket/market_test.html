<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Ticker - WebSocket 行情推送测试</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .status {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.2);
            margin-top: 10px;
        }

        .status.connected {
            background: #10b981;
        }

        .status.disconnected {
            background: #ef4444;
        }

        .controls {
            padding: 20px 30px;
            background: #f9fafb;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .btn-success {
            background: #10b981;
            color: white;
        }

        .btn-success:hover {
            background: #059669;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .input-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .input-group label {
            font-size: 14px;
            color: #6b7280;
            font-weight: 500;
        }

        .input-group input {
            padding: 8px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
            width: 300px;
        }

        .auth-section {
            padding: 15px 30px;
            background: #fef3c7;
            border-bottom: 1px solid #fbbf24;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .ticker-list {
            padding: 20px 30px;
            max-height: 600px;
            overflow-y: auto;
        }

        .ticker-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid #e5e7eb;
            transition: background 0.2s;
        }

        .ticker-item:hover {
            background: #f9fafb;
        }

        .ticker-item.hot {
            background: #fef3c7;
        }

        .ticker-item.hot:hover {
            background: #fde68a;
        }

        .ticker-symbol {
            font-size: 16px;
            font-weight: 600;
            color: #111827;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .hot-badge {
            background: #f59e0b;
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }

        .ticker-data {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .ticker-price {
            font-size: 18px;
            font-weight: 600;
            color: #111827;
        }

        .ticker-change {
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
        }

        .ticker-change.positive {
            background: #d1fae5;
            color: #065f46;
        }

        .ticker-change.negative {
            background: #fee2e2;
            color: #991b1b;
        }

        .ticker-volume {
            font-size: 12px;
            color: #6b7280;
        }

        .ticker-range {
            font-size: 12px;
            color: #9ca3af;
        }

        .logs {
            padding: 20px 30px;
            background: #1f2937;
            color: #d1d5db;
            max-height: 200px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.6;
        }

        .log-entry {
            margin-bottom: 4px;
        }

        .log-entry .time {
            color: #9ca3af;
        }

        .log-entry .info {
            color: #60a5fa;
        }

        .log-entry .success {
            color: #34d399;
        }

        .log-entry .error {
            color: #f87171;
        }

        .stats {
            padding: 20px 30px;
            background: #f9fafb;
            border-top: 1px solid #e5e7eb;
            display: flex;
            gap: 30px;
            justify-content: center;
        }

        .stat-item {
            text-align: center;
        }

        .stat-label {
            font-size: 12px;
            color: #6b7280;
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: #667eea;
        }

        .flash {
            animation: flash 0.5s;
        }

        @keyframes flash {
            0%, 100% { background: transparent; }
            50% { background: #fef3c7; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Market Ticker - 行情推送测试</h1>
        <div class="status" id="status">未连接</div>
    </div>

    <div class="controls">
        <button class="btn btn-primary" id="connectBtn" onclick="connect()">连接 WebSocket</button>
        <button class="btn btn-danger" id="disconnectBtn" onclick="disconnect()" disabled>断开连接</button>

        <div class="input-group" style="margin-left: auto;">
            <label>WebSocket URL:</label>
            <input type="text" id="wsUrl" value="ws://127.0.0.1:9502/ws" placeholder="ws://127.0.0.1:9502/ws">
        </div>
    </div>

    <div class="auth-section">
        <div class="input-group">
            <label>Token:</label>
            <input type="text" id="token" value="" placeholder="请输入 JWT Token">
        </div>
        <button class="btn btn-success" id="loginBtn" onclick="login()" disabled>登录认证</button>
        <button class="btn btn-success" id="subscribeHotBtn" onclick="subscribeHot()" disabled>订阅热门币种</button>
    </div>

    <div class="ticker-list" id="tickerList">
        <div style="text-align: center; padding: 40px; color: #9ca3af;">
            请先连接 WebSocket 并订阅行情
        </div>
    </div>

    <div class="stats">
        <div class="stat-item">
            <div class="stat-label">已订阅币种</div>
            <div class="stat-value" id="subscribedCount">0</div>
        </div>
        <div class="stat-item">
            <div class="stat-label">接收消息数</div>
            <div class="stat-value" id="messageCount">0</div>
        </div>
        <div class="stat-item">
            <div class="stat-label">更新频率</div>
            <div class="stat-value" id="updateRate">0/s</div>
        </div>
    </div>

    <div class="logs" id="logs"></div>
</div>

<script>
    let ws = null;
    let tickerData = {};
    let subscribedSymbols = new Set();
    let messageCount = 0;
    let lastSecondCount = 0;
    let opIdCounter = 0;
    let isAuthenticated = false;

    // 热门币种列表（前20个）- 注意：后端使用无斜杠格式
    const hotSymbols = [
        'BTCUSDT', 'ETHUSDT', 'BNBUSDT', 'XRPUSDT', 'ADAUSDT',
        'SOLUSDT', 'DOGEUSDT', 'DOTUSDT', 'MATICUSDT', 'SHIBUSDT',
        'AVAXUSDT', 'UNIUSDT', 'LINKUSDT', 'ATOMUSDT', 'LTCUSDT',
        'BCHUSDT', 'TRXUSDT', 'ETCUSDT', 'XLMUSDT', 'ALGOUSDT'
    ];

    function connect() {
        const wsUrl = document.getElementById('wsUrl').value;

        if (!wsUrl) {
            alert('请输入 WebSocket 地址');
            return;
        }

        addLog('连接中...', 'info');

        ws = new WebSocket(wsUrl);

        ws.onopen = () => {
            addLog('WebSocket 连接成功', 'success');
            updateStatus('已连接', true);

            document.getElementById('connectBtn').disabled = true;
            document.getElementById('disconnectBtn').disabled = false;
            document.getElementById('loginBtn').disabled = false;
        };

        ws.onmessage = (event) => {
            try {
                const message = JSON.parse(event.data);
                handleMessage(message);
            } catch (e) {
                addLog('解析消息失败: ' + e.message, 'error');
            }
        };

        ws.onerror = (error) => {
            addLog('WebSocket 错误', 'error');
        };

        ws.onclose = () => {
            addLog('WebSocket 连接已关闭', 'info');
            updateStatus('未连接', false);

            document.getElementById('connectBtn').disabled = false;
            document.getElementById('disconnectBtn').disabled = true;
            document.getElementById('loginBtn').disabled = true;
            document.getElementById('subscribeHotBtn').disabled = true;
            isAuthenticated = false;
        };
    }

    function disconnect() {
        if (ws) {
            ws.close();
            ws = null;
        }
    }

    function login() {
        const token = document.getElementById('token').value;
        if (!token) {
            alert('请输入 Token');
            return;
        }

        sendMessage('login', { token: token });
        addLog('发送登录请求...', 'info');
    }

    function subscribeHot() {
        if (!isAuthenticated) {
            alert('请先登录认证');
            return;
        }
        // 注意：不需要传 fd 参数，服务端会自动处理
        sendMessage('market.subscribe.hot', {});
        addLog('订阅热门币种...', 'info');
    }

    function sendMessage(action, data) {
        if (!ws || ws.readyState !== WebSocket.OPEN) {
            addLog('WebSocket 未连接', 'error');
            return;
        }

        const message = {
            action: action,
            data: data,
            op_id: 'op_' + (++opIdCounter)
        };

        ws.send(JSON.stringify(message));
    }

    function handleMessage(message) {
        messageCount++;
        updateStats();

        // 处理连接成功消息
        if (message.success && message.message === 'connected successfully') {
            addLog('收到服务器欢迎消息', 'success');
            return;
        }

        // 处理登录响应
        if (message.success && message.message && message.message.includes('Auth successfully')) {
            isAuthenticated = true;
            addLog('登录认证成功！', 'success');
            document.getElementById('subscribeHotBtn').disabled = false;
            return;
        }

        // 处理推送消息（ticker 数据）
        if (message.data && message.data.event) {
            switch (message.data.event) {
                case 'market.hot.tickers':
                    handleHotTickers(message.data.tickers);
                    break;
                case 'market.ticker':
                    handleSingleTicker(message.data);
                    break;
            }
            return;
        }

        // 处理订阅响应
        if (message.success && message.message) {
            addLog(message.message, 'success');
            if (message.data && message.data.subscribed) {
                message.data.subscribed.forEach(s => subscribedSymbols.add(s));
                addLog(`已订阅 ${message.data.subscribed.length} 个币种`, 'success');
            }
            return;
        }

        // 处理错误消息
        if (!message.success && message.message) {
            addLog('错误: ' + message.message, 'error');
            return;
        }
    }

    function handleHotTickers(tickers) {
        if (!Array.isArray(tickers)) return;

        tickers.forEach(ticker => {
            tickerData[ticker.symbol] = ticker;
        });

        renderTickers();
    }

    function handleSingleTicker(ticker) {
        if (!ticker.symbol) return;
        tickerData[ticker.symbol] = ticker;
        renderTickers();
    }

    function renderTickers() {
        const container = document.getElementById('tickerList');
        const symbols = Object.keys(tickerData).sort();

        if (symbols.length === 0) {
            container.innerHTML = '<div style="text-align: center; padding: 40px; color: #9ca3af;">暂无数据</div>';
            return;
        }

        let html = '';
        symbols.forEach(symbol => {
            const ticker = tickerData[symbol];
            const isHot = hotSymbols.includes(symbol);

            // 前端计算涨跌幅
            const lastPrice = parseFloat(ticker.last_price || 0);
            const openPrice = parseFloat(ticker.open_price || 0);
            const changePercent = openPrice > 0 ? ((lastPrice - openPrice) / openPrice * 100).toFixed(2) : '0.00';
            const isPositive = parseFloat(changePercent) >= 0;

            html += `
                <div class="ticker-item ${isHot ? 'hot' : ''}" id="ticker-${symbol.replace('/', '-')}">
                    <div class="ticker-symbol">
                        ${symbol}
                        ${isHot ? '<span class="hot-badge">HOT</span>' : ''}
                    </div>
                    <div class="ticker-data">
                        <div class="ticker-price">$${lastPrice.toFixed(2)}</div>
                        <div class="ticker-change ${isPositive ? 'positive' : 'negative'}">
                            ${isPositive ? '+' : ''}${changePercent}%
                        </div>
                        <div class="ticker-volume">
                            Vol: ${formatVolume(ticker.volume)}
                        </div>
                        <div class="ticker-range">
                            H: $${ticker.high_price} / L: $${ticker.low_price}
                        </div>
                    </div>
                </div>
            `;
        });

        container.innerHTML = html;
    }

    function formatVolume(volume) {
        const num = parseInt(volume);
        if (num >= 1000000000) {
            return (num / 1000000000).toFixed(2) + 'B';
        } else if (num >= 1000000) {
            return (num / 1000000).toFixed(2) + 'M';
        } else if (num >= 1000) {
            return (num / 1000).toFixed(2) + 'K';
        }
        return num.toString();
    }

    function updateStats() {
        document.getElementById('subscribedCount').textContent = subscribedSymbols.size;
        document.getElementById('messageCount').textContent = messageCount;
    }

    function updateStatus(text, connected) {
        const status = document.getElementById('status');
        status.textContent = text;
        status.className = 'status ' + (connected ? 'connected' : 'disconnected');
    }

    function addLog(message, type = 'info') {
        const logs = document.getElementById('logs');
        const time = new Date().toLocaleTimeString();
        const entry = document.createElement('div');
        entry.className = 'log-entry';
        entry.innerHTML = `<span class="time">[${time}]</span> <span class="${type}">${message}</span>`;
        logs.appendChild(entry);
        logs.scrollTop = logs.scrollHeight;

        // 限制日志数量
        if (logs.children.length > 100) {
            logs.removeChild(logs.firstChild);
        }
    }

    // 每秒计算更新频率
    setInterval(() => {
        document.getElementById('updateRate').textContent = messageCount - lastSecondCount;
        lastSecondCount = messageCount;
    }, 1000);
</script>
</body>
</html>
