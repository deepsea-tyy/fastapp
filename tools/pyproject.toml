[project]
name = "fastapp-tools"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = [
    "httpx[socks]>=0.28.1",
    # transformers≥5.3（omnivoice）要求 huggingface-hub≥1.3；锁定下限与本仓库 HF 下载一致
    "huggingface-hub>=1.5.0,<2.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.32.0",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "torch>=2.4.0",
    "torchvision>=0.17.0",
    "torchaudio>=2.4.0",
    "transformers>=5.3.0",
    "diffusers>=0.36.0",
    "ftfy>=6.0.0",
    "omnivoice>=0.1.5",
    "accelerate>=0.33.0",
    "safetensors>=0.4.0",
    "llama-cpp-python>=0.2.90",
    "protobuf>=3.20.0",
    "playwright>=1.49.0",
    "gguf>=0.19.0",
    "imageio>=2.37.3",
    "imageio-ffmpeg>=0.6.0",
    "opencv-python>=4.13.0.92",
    "rembg[cpu]>=2.0.50",
]

[tool.uv]
# 仅锁定/安装依赖，不把本目录当作可安装包；避免 setuptools 在仓库内生成 *.egg-info
package = false

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
