<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StoryStudio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f1117;
      color: #e8eaed;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .wrap { text-align: center; padding: 2rem; max-width: 480px; }
    h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 0.5rem; }
    p { color: #9aa0a6; font-size: 0.875rem; line-height: 1.5; }
    .dot {
      display: inline-block;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #5b8def;
      margin: 1rem 3px 0;
      animation: pulse 1.2s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse {
      0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1); }
    }
    .err { color: #ea4335; margin-top: 1rem; white-space: pre-wrap; text-align: left; font-size: 0.8125rem; }
    .hint { color: #9aa0a6; margin-top: 0.75rem; font-size: 0.75rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>StoryStudio</h1>
    <p id="status">正在启动…</p>
    <div id="dots">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
    <p id="error" class="err" hidden></p>
    <p id="hint" class="hint" hidden></p>
  </div>
  <script>
    const statusEl = document.getElementById('status');
    const errorEl = document.getElementById('error');
    const hintEl = document.getElementById('hint');
    const dotsEl = document.getElementById('dots');

    async function boot() {
      const tauri = window.__TAURI__;
      if (!tauri) {
        statusEl.textContent = '等待 Tauri 运行时…';
        return;
      }
      try {
        statusEl.textContent = '正在准备应用数据…';
        await tauri.core.invoke('install_bundled');
        statusEl.textContent = '正在启动服务…';
        await tauri.core.invoke('start_services');
      } catch (e) {
        dotsEl.hidden = true;
        errorEl.hidden = false;
        errorEl.textContent = String(e);
        statusEl.textContent = '启动失败，请查看日志后重试';
        try {
          const paths = await tauri.core.invoke('get_app_paths');
          hintEl.hidden = false;
          hintEl.textContent =
            '日志：' + paths.root + '/runtime/hyperf.log\n' +
            '      ' + paths.logs + '/desktop.log';
        } catch (_) {}
      }
    }
    boot();
  </script>
</body>
</html>
