<!DOCTYPE html>
<html>
<head>
    <base href="$FLUTTER_BASE_HREF">

    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="description" content="fastapp">
    <!-- 移动端优化 -->
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="format-detection" content="telephone=no">
    <meta name="theme-color" content="#ffffff">

    <!-- iOS meta tags & icons -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="fastapp">
    <link rel="apple-touch-icon" href="assets/images/launch/logo.png">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/images/launch/logo.png"/>

    <title>fastapp</title>
    <link rel="manifest" href="manifest.json">

    <style>
        /* 启动覆盖层 */
        #app-splash-overlay {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background-color: #ffffff;
            background-image: url("assets/images/launch/light-background.png");
            background-size: cover; /* 按屏幕宽度自适应，高度自动 */
            background-repeat: no-repeat;
            background-position: center center;
            z-index: 9998; /* 保留 Flutter loading bar 显示 */
            opacity: 1;
            transition: opacity 0.4s ease-out;
        }

        #app-splash-overlay.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        /* 滚动条样式 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f0f0f0;
        }

        ::-webkit-scrollbar-thumb {
            background: #808080;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #666666;
        }

        * {
            scrollbar-width: thin;
            scrollbar-color: #808080 #f0f0f0;
        }
    </style>

    <script>
        (function () {
            const FADE_OUT_TIME = 400; // ms

            function hideSplash() {
                const splash = document.getElementById('app-splash-overlay');
                if (!splash) return;
                splash.classList.add('fade-out');
                setTimeout(() => splash.remove(), FADE_OUT_TIME);
            }

            // DOM 就绪后预加载图片，确保开发阶段不会闪动
            document.addEventListener('DOMContentLoaded', () => {
                const splash = document.getElementById('app-splash-overlay');
                const img = new Image();
                img.src = "assets/images/launch/light-background.png";
                img.onload = () => {
                    splash.style.backgroundImage = `url(${img.src})`;
                };
            });

            // Flutter 完全加载后淡出覆盖层
            window.addEventListener('load', () => {
                setTimeout(hideSplash, 500); // 可调整延迟，保证 Flutter loading bar 显示
            });
        })();
    </script>
</head>

<body>
<!-- 启动覆盖层 -->
<div id="app-splash-overlay"></div>
<script src="flutter_bootstrap.js" async></script>
</body>
</html>
