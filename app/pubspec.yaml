name: fastapp
description: Fastapp - A flutter project created using MobX and Provider.

version: 1.0.0+1

environment:
  sdk: '>=3.0.6 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  # A
  another_flushbar: ^1.12.29
  # B
  # C
  cupertino_icons: ^1.0.5
  # D
  dio: ^5.1.1
  # E
  event_bus: ^2.0.0
  # F
  fl_chart: ^0.69.0
  flutter_mobx: ^2.0.6+5
  # G
  geolocator: ^12.0.0
  geocoding: ^3.0.0
  get_it: ^7.2.0
  google_fonts: ^4.0.3
  # H
  http: ^0.13.5
  flutter_html: ^3.0.0-beta.2
  html: ^0.15.4
  # I
  intl: ^0.20.2
  image_picker: ^1.0.7
  # J
  json_serializable: ^6.6.1
  # K
  k_chart_plus:
    path: packages/k_chart_plus
  # L
  # M
  mobx: ^2.1.4
  # N
  # O
  # P
  path_provider: ^2.1.0
  # Q
  # R
  # S
  shared_preferences: ^2.1.0
  sembast_web: ^2.1.3
  sembast: ^3.4.4
  # T
  # U
  url_launcher: ^6.2.2
  # V
  validators: ^3.0.0
  # W
  web_socket_channel: ^2.4.0
  # X
  xxtea: ^2.1.0
  cached_network_image: ^3.3.1
  # Y
  # Z

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The following adds the launcher icon support to your application.
  # run below mentioned commands to generate launcher icons
  # flutter packages get
  # flutter packages pub run flutter_launcher_icons:main
  flutter_launcher_icons: ^0.13.1
  mobx_codegen: ^2.2.0
  build_runner: ^2.3.3
  analyzer: ^5.10.0
  image: ^4.1.7

flutter_icons:
  image_path: "assets/icons/ic_launcher.png"
  android: true
  ios: true

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: ProductSans
      fonts:
        - asset: assets/fonts/Product-Sans-Regular.ttf
        - asset: assets/fonts/Product-Sans-Italic.ttf
          style: italic
        - asset: assets/fonts/Product-Sans-Bold.ttf
          weight: 700
